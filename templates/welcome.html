<!DOCTYPE html>
<html>

<head>

<title>Welcome</title>

<link rel="stylesheet" href="/static/style.css">

<style>

body{
background:linear-gradient(135deg,#1e3c72,#2a5298);
height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-family:Arial;
}

.card{
text-align:center;
padding:40px;
background:rgba(255,255,255,0.1);
border-radius:15px;
backdrop-filter:blur(10px);
animation:fadeIn 1.5s;
}

button{
margin-top:20px;
padding:15px 25px;
font-size:18px;
background:#00c6ff;
border:none;
border-radius:8px;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.1);
background:#0072ff;
color:white;
}

@keyframes fadeIn{
from{opacity:0; transform:translateY(40px);}
to{opacity:1; transform:translateY(0);}
}

</style>

</head>

<body>

<div class="card">

<h1>Welcome to</h1>

<h1>📊 Micro Price Shifter</h1>

<p>Smart Product Price Monitoring System</p>

<a href="/home">
<button>Enter Dashboard</button>
</a>

</div>

</body>

</html>
